<text x="40" y="372" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="150" font-weight="900" letter-spacing="-8" textLength="1120" lengthAdjust="spacingAndGlyphs" fill="#fafafc">andrés márquez</text>
</g>
