<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380">
<style>
.w{opacity:0;animation:in .8s cubic-bezier(.22,1,.36,1) forwards}
@keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.mark{animation:rise 1.2s cubic-bezier(.16,1,.3,1) .2s both}
@keyframes rise{from{transform:translateY(80px);opacity:0}to{transform:none;opacity:1}}
.spin{transform-origin:1010px 140px;animation:spin 40s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.pulse{transform-origin:62px 54px;animation:p 2.2s ease-out infinite}
@keyframes p{0%{transform:scale(1);opacity:.6}100%{transform:scale(3);opacity:0}}
</style>
<rect width="1200" height="380" rx="24" fill="#111118"/>
<rect x=".5" y=".5" width="1199" height="379" rx="24" fill="none" stroke="#2c2c38"/>
<g class="spin" fill="none" stroke="#40404f" stroke-width="1.2" opacity=".8">
  <polygon points="1010,40 1097,90 1097,190 1010,240 923,190 923,90"/>
  <polygon points="1010,75 1066,108 1066,172 1010,205 954,172 954,108"/>
  <line x1="1010" y1="40" x2="1010" y2="240"/><line x1="923" y1="90" x2="1097" y2="190"/><line x1="1097" y1="90" x2="923" y2="190"/>
</g>
<circle cx="860" cy="70" r="2.2" fill="#fafafc" opacity="0.5"><animate attributeName="cy" values="70;56;70" dur="6s" repeatCount="indefinite"/></circle><circle cx="930" cy="120" r="1.6" fill="#fafafc" opacity="0.35"><animate attributeName="cy" values="120;106;120" dur="7s" repeatCount="indefinite"/></circle><circle cx="1010" cy="60" r="2.6" fill="#fafafc" opacity="0.45"><animate attributeName="cy" values="60;46;60" dur="5.5s" repeatCount="indefinite"/></circle><circle cx="1090" cy="140" r="1.8" fill="#fafafc" opacity="0.3"><animate attributeName="cy" values="140;126;140" dur="8s" repeatCount="indefinite"/></circle><circle cx="1140" cy="80" r="2" fill="#fafafc" opacity="0.4"><animate attributeName="cy" values="80;66;80" dur="6.5s" repeatCount="indefinite"/></circle><circle cx="980" cy="170" r="1.4" fill="#fafafc" opacity="0.3"><animate attributeName="cy" values="170;156;170" dur="7.5s" repeatCount="indefinite"/></circle><circle cx="900" cy="190" r="2.1" fill="#fafafc" opacity="0.35"><animate attributeName="cy" values="190;176;190" dur="6.8s" repeatCount="indefinite"/></circle><circle cx="1060" cy="210" r="1.5" fill="#fafafc" opacity="0.25"><animate attributeName="cy" values="210;196;210" dur="9s" repeatCount="indefinite"/></circle>
<circle class="pulse" cx="62" cy="54" r="5" fill="#3ecf8e"/>
<circle cx="62" cy="54" r="5" fill="#3ecf8e"/>
<text x="78" y="59" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#8b8b98" letter-spacing="1.5">AVAILABLE FOR WORK · CARACAS, VENEZUELA · REMOTE</text>
<text class="w" style="animation-delay:.1s" x="56" y="130" font-family="Georgia, 'Times New Roman', serif" font-size="50" fill="#fafafc">Software that scales,</text>
<text class="w" style="animation-delay:.35s" x="56" y="190" font-family="Georgia, 'Times New Roman', serif" font-size="50" font-style="italic" fill="#fafafc">work that runs itself.</text>
<text class="w" style="animation-delay:.6s" x="58" y="232" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" fill="#8b8b98">Fullstack developer &amp; automation engineer · Laravel · Vue · React · n8n · Python</text>
